# This is a Declarative Automation Bundle definition for new_bakehouse_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: new_bakehouse_analytics
  uuid: fd3c7b6d-5c4c-4929-a2a2-eef5262c2c59

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    presets:
      name_prefix: dev_
    default: true
    workspace:
      host: https://dbc-4b3d8219-80d2.cloud.databricks.com
    variables:
      catalog: new_basehouse_analytics_dev
      schema: r_n_d
  prod:
    presets:
      name_prefix: prod_
    mode: production
    workspace:
      host: https://dbc-4b3d8219-80d2.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/soumya.kolukuluri2407@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/soumya.kolukuluri2407@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: new_basehouse_analytics_prod
      schema: r_n_d
    permissions:
      - user_name: soumya.kolukuluri2407@gmail.com
        level: CAN_MANAGE

# A sample job for new_bakehouse_analytics.

resources:
  jobs:
    bakehouse_data_refresh:
      name: bakehouse_data_refresh

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      tasks:
        - task_key: customer_360
          notebook_task:
            notebook_path: ../src/new_customer_360.ipynb
        
        - task_key: transactions_summary
          depends_on:
            - task_key: customer_360
          notebook_task:
            notebook_path: ../src/transactions_summary.ipynb
            

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              # By default we just include the .whl file generated for the new_bakehouse_analytics package.
              # See https://docs.databricks.com/dev-tools/bundles/library-dependencies.html
              # for more information on how to add other libraries.
              - ../dist/*.whl

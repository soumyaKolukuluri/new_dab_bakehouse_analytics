# The main pipeline for new_bakehouse_analytics

resources:
  pipelines:
    new_bakehouse_analytics_etl:
      name: new_bakehouse_analytics_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/new_bakehouse_analytics_etl"

      libraries:
        - glob:
            include: ../src/new_bakehouse_analytics_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
